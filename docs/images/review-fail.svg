<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="640" viewBox="0 0 1080 640" role="img" aria-label="AI Commit Review 错误提示示例">
  <rect width="1080" height="640" fill="#f3f4f6"/>
  <rect x="72" y="54" width="936" height="532" rx="10" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="72" y="54" width="936" height="66" rx="10" fill="#f9fafb"/>
  <rect x="72" y="54" width="8" height="532" fill="#dc2626"/>
  <text x="104" y="96" font-family="Microsoft YaHei UI, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#111827">AI Commit Review</text>
  <text x="104" y="124" font-family="Microsoft YaHei UI, Segoe UI, Arial, sans-serif" font-size="13" fill="#6b7280">.git/ai-review/last-review.md</text>
  <rect x="886" y="76" width="84" height="34" rx="3" fill="#fef2f2"/>
  <text x="928" y="99" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#dc2626">FAIL</text>

  <rect x="104" y="150" width="864" height="376" rx="6" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="128" y="188" font-family="Microsoft YaHei UI, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#dc2626">结论: FAIL</text>

  <text x="128" y="232" font-family="Microsoft YaHei UI, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#991b1b">阻断问题</text>
  <rect x="128" y="250" width="790" height="82" rx="6" fill="#fef2f2" stroke="#fecaca"/>
  <text x="148" y="280" font-family="Consolas, Menlo, monospace" font-size="14" fill="#111827">src/main/java/com/example/OrderService.java</text>
  <text x="148" y="306" font-family="Microsoft YaHei UI, Segoe UI, Arial, sans-serif" font-size="15" fill="#374151">新增调用的方法签名与接口定义不一致，可能导致编译失败。</text>

  <text x="128" y="372" font-family="Microsoft YaHei UI, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#92400e">非阻断建议</text>
  <rect x="128" y="390" width="790" height="58" rx="6" fill="#fffbeb" stroke="#fde68a"/>
  <text x="148" y="424" font-family="Microsoft YaHei UI, Segoe UI, Arial, sans-serif" font-size="15" fill="#374151">重复的参数校验可以抽成私有方法，降低后续维护成本。</text>

  <text x="128" y="488" font-family="Microsoft YaHei UI, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#334155">验证建议</text>
  <text x="148" y="518" font-family="Consolas, Menlo, monospace" font-size="14" fill="#111827">mvn test 或 mvn -q -DskipTests compile</text>

  <rect x="784" y="546" width="96" height="36" rx="4" fill="#dc2626"/>
  <text x="832" y="570" text-anchor="middle" font-family="Microsoft YaHei UI, Segoe UI, Arial, sans-serif" font-size="14" fill="#ffffff">Close</text>
  <rect x="112" y="546" width="96" height="36" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="160" y="570" text-anchor="middle" font-family="Microsoft YaHei UI, Segoe UI, Arial, sans-serif" font-size="14" fill="#111827">Copy</text>
</svg>
